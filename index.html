    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function() {
        var APP_VERSION = '20261004_v9';
        try {
          var v = localStorage.getItem('wu_build_version');
          if (v !== APP_VERSION) {
            localStorage.setItem('wu_build_version', APP_VERSION);
            try {
              for (var i = localStorage.length - 1; i >= 0; i--) {
                var k = localStorage.key(i);
                if (k && (k.indexOf('wu_') === 0 || k.indexOf('product') !== -1 || k.indexOf('block') !== -1 || k.indexOf('store') !== -1)) {
                  if (k !== 'wu_build_version' && k !== 'wu_cart_v1' && k !== 'wu_wishlist_v1') {
                    localStorage.removeItem(k);
                  }
                }
              }
            } catch(e) {}
            try {
              if (window.sessionStorage) sessionStorage.clear();
            } catch(e) {}
            try {
              if (window.indexedDB && window.indexedDB.deleteDatabase) {
                window.indexedDB.deleteDatabase('wearing_unusual_store');
              }
            } catch(e) {}
            try {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var r of regs) { r.unregister(); }
                });
              }
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  for (var name of names) { caches.delete(name); }
                });
              }
            } catch(e) {}
          }
        } catch(e) {}
      })();
    </script>
